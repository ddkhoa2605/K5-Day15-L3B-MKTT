# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số không có nguồn ghi rõ "(tự ước tính)"; simulate nhắc nếu còn dòng mẫu chưa thay.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # người dùng: freelancer / agency nhỏ / tech lead dựng app Next.js + Supabase cho SME Việt Nam
  low: 200
  base: 1000
  high: 3000
  source: "(tự ước tính) — chưa có số công khai về số freelancer/agency dựng app Next.js + Supabase cho SME ở Việt Nam. Thay khi có số từ phỏng vấn hoặc cộng đồng (nhóm Facebook, Discord dev Việt)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  # Một phiên = quét 1 repo (1 lượt hỏi). Lượt 2–3 = quét lại sau khi sửa code.
  - name: freelancer_agency
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 4       # nhiều app / tháng cho nhiều khách
    turns_per_session: 2    # quét, sửa, quét lại
    source: "(tự ước tính) — chờ phỏng vấn freelancer/agency (evidence/interviews/) để thay"
  - name: tech_lead_startup
    share: 0.2
    uses_per_month: 2       # quét trước mỗi đợt phát hành / trước khi gọi vốn
    turns_per_session: 3    # quét nhiều lần đến khi hết cảnh báo
    source: "(tự ước tính) — chờ phỏng vấn tech lead startup để thay"
  - name: founder_tu_lam
    share: 0.3
    uses_per_month: 1       # quét 1–2 lần cho app của mình
    turns_per_session: 1
    source: "(tự ước tính) — chờ phỏng vấn để thay"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  # Tên model khớp codebase/ai.py: MODEL_NAME (phân loại cột, chế độ llm) · MODEL_NAME_VERIFY (kiểm chứng đường đi)
  - model: gpt-6-luna
    input: 0.10
    output: 0.50
    source: "https://developers.openai.com/api/docs/pricing · bảng Standard, short context · xem 27/11/2026 (chưa đối chiếu further-reading/model-prices.md của repo đề)"
  - model: gpt-6.1-terra
    input: 1.00
    output: 5.00
    source: "https://developers.openai.com/api/docs/pricing · bảng Standard, short context · xem 27/11/2026 (chưa đối chiếu further-reading/model-prices.md của repo đề). Giá batch 0.50/2.50 không dùng"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
